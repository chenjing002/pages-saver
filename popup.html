<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 14px; font: 13px -apple-system, sans-serif; color: #111; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row span { flex: 1; }
  button { padding: 7px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; font: inherit; }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; width: 100%; font-weight: 600; }
  button.stop { background: #dc2626; color: #fff; border-color: #dc2626; width: 100%; font-weight: 600; }
  input { width: 64px; padding: 5px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  .ok { color: #16a34a; } .no { color: #999; }
  #msg { margin-top: 10px; color: #555; min-height: 16px; }
  hr { border: 0; border-top: 1px solid #eee; margin: 10px 0; }
</style>
</head>
<body>
  <h1>Pages Saver</h1>

  <div class="row"><button id="area">1. Select area</button><span id="areaInfo" class="no">not set</span></div>
  <div class="row"><button id="next">2. Pick next button</button><span id="nextInfo" class="no">not set</span></div>
  <hr>
  <div class="row"><span>Pages to save</span><input id="count" type="number" min="1" value="10"></div>
  <div class="row"><span>Wait after click (seconds)</span><input id="delay" type="number" min="1" step="0.5" value="6"></div>
  <hr>
  <button id="start" class="primary">Start</button>
  <button id="stop" class="stop" hidden>Stop</button>
  <div id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
